[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-roast-room"
version = "0.1.0"
description = "Orchestrateur de débat entre agents pour analyser des options d'investissement"
requires-python = ">=3.11"

[project.scripts]
financial-roast-room = "financial_roast_room.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
